[package]
name = "lulwimi"
version = "0.1.0"
description = "Lulwimi: siSwati & isiZulu desktop widget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Lets the app's own pages use the microphone (pronunciation practice) without a WebView2 prompt.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
